<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <rect width="400" height="400" fill="#f8fafc" rx="12"/>
  <ellipse cx="200" cy="340" rx="110" ry="12" fill="#000000" opacity="0.1" filter="blur(5px)"/>

  <!-- Universal Dash and Vent Mount Kit -->
  <g transform="translate(100, 100)">
    <!-- Swivel Mount Plate (AMPS pattern) -->
    <rect x="50" y="30" width="100" height="70" rx="8" fill="#1e2229" stroke="#333b47" stroke-width="2"/>
    <circle cx="65" cy="45" r="4" fill="#64748b"/>
    <circle cx="135" cy="45" r="4" fill="#64748b"/>
    <circle cx="65" cy="85" r="4" fill="#64748b"/>
    <circle cx="135" cy="85" r="4" fill="#64748b"/>

    <!-- Swivel Ball Joint -->
    <circle cx="100" cy="120" r="24" fill="#374151" stroke="#1f2937" stroke-width="2"/>
    <path d="M 85 135 L 75 190 L 125 190 L 115 135 Z" fill="#1e242c"/>

    <!-- Adhesive Base Pad -->
    <ellipse cx="100" cy="195" rx="60" ry="24" fill="#111827" stroke="#374151" stroke-width="2"/>
    <text x="100" y="200" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">3M™ VHB Adhesive</text>

    <!-- Side Vent Clamp Clip -->
    <g transform="translate(140, 90)">
      <rect x="0" y="0" width="35" height="15" rx="3" fill="#2d333b"/>
      <rect x="25" y="15" width="10" height="40" rx="2" fill="#475569"/>
      <rect x="10" y="15" width="10" height="40" rx="2" fill="#475569"/>
    </g>
  </g>

  <rect x="90" y="32" width="220" height="26" rx="13" fill="#002b49"/>
  <text x="200" y="49" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">DASH & VENT DUAL MOUNT</text>
</svg>

