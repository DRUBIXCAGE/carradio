<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <rect width="400" height="400" fill="#f8fafc" rx="12"/>
  <ellipse cx="200" cy="355" rx="160" ry="16" fill="#000000" opacity="0.12" filter="blur(6px)"/>

  <!-- SXSD2 Portable Speaker Dock / Boombox -->
  <g transform="translate(40, 110)">
    <!-- Handle -->
    <path d="M 60 40 Q 160 -10 260 40 L 250 50 Q 160 5 70 50 Z" fill="#333b47"/>

    <!-- Main Cabinet Housing -->
    <rect x="10" y="40" width="300" height="190" rx="20" fill="#1b1f24" stroke="#2d3540" stroke-width="3"/>

    <!-- Left Speaker Grille -->
    <circle cx="70" cy="140" r="45" fill="#121518" stroke="#333d49" stroke-width="3"/>
    <circle cx="70" cy="140" r="32" fill="#1a1e23"/>
    <circle cx="70" cy="140" r="16" fill="#00629B"/>

    <!-- Right Speaker Grille -->
    <circle cx="250" cy="140" r="45" fill="#121518" stroke="#333d49" stroke-width="3"/>
    <circle cx="250" cy="140" r="32" fill="#1a1e23"/>
    <circle cx="250" cy="140" r="16" fill="#00629B"/>

    <!-- Center Dock Well for Onyx Radio -->
    <rect x="125" y="80" width="70" height="90" rx="8" fill="#0c0e10" stroke="#0073D1" stroke-width="2"/>
    <rect x="135" y="95" width="50" height="35" rx="3" fill="#020406"/>
    <text x="160" y="115" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="8" font-weight="700" text-anchor="middle">SATELLITE</text>
    <rect x="135" y="140" width="50" height="15" rx="2" fill="#1e242c"/>

    <!-- Volume & Power Controls -->
    <circle cx="160" cy="200" r="14" fill="#2d3540" stroke="#4b5563" stroke-width="2"/>
    <circle cx="160" cy="200" r="8" fill="#1e242c"/>

    <!-- SiriusXM Branding on Boombox -->
    <text x="160" y="65" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" font-weight="800" text-anchor="middle" letter-spacing="1">Sirius<tspan fill="#008BE2">XM</tspan> SOUND</text>
  </g>
</svg>

