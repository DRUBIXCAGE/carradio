<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <filter id="bundleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#001830" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="#f8fafc"/>

  <!-- Bundle Banner -->
  <rect x="50" y="30" width="700" height="44" rx="8" fill="#002b49"/>
  <text x="400" y="58" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="800" text-anchor="middle">ONYX EZR VEHICLE + HOME COMPLETE BUNDLE</text>

  <!-- Left: Vehicle System -->
  <g transform="translate(60, 100)" filter="url(#bundleShadow)">
    <rect x="0" y="0" width="320" height="420" rx="14" fill="#ffffff" stroke="#00629B" stroke-width="2"/>
    <rect x="16" y="16" width="120" height="26" rx="4" fill="#00629B"/>
    <text x="76" y="34" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="800" text-anchor="middle">FOR YOUR CAR</text>

    <!-- Mini Radio in Vehicle Dock -->
    <rect x="40" y="70" width="240" height="150" rx="12" fill="#1e2229"/>
    <rect x="55" y="85" width="140" height="70" rx="4" fill="#03070b"/>
    <text x="65" y="105" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="9" font-weight="700">CH 56 The Highway</text>
    <circle cx="215" cy="120" r="16" fill="#2d333d"/>
    <rect x="55" y="170" width="150" height="15" fill="#2a303c" rx="2"/>

    <!-- Vehicle Accessories Mini -->
    <g transform="translate(40, 240)">
      <circle cx="25" cy="25" r="18" fill="#f1f5f9"/>
      <ellipse cx="25" cy="25" rx="12" ry="7" fill="#1e242c"/>
      <text x="55" y="30" fill="#334155" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Magnetic Car Antenna</text>

      <circle cx="25" cy="70" r="18" fill="#f1f5f9"/>
      <rect x="18" y="60" width="14" height="20" rx="3" fill="#1e242c"/>
      <text x="55" y="75" fill="#334155" font-family="system-ui, sans-serif" font-size="12" font-weight="700">12V PowerConnect Adapter</text>

      <circle cx="25" cy="115" r="18" fill="#f1f5f9"/>
      <path d="M 18 115 L 32 115" stroke="#00629B" stroke-width="3"/>
      <text x="55" y="120" fill="#334155" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Dash & Vent Swivel Mounts</text>
    </g>
  </g>

  <!-- Center Plus Graphic -->
  <circle cx="400" cy="300" r="26" fill="#00629B"/>
  <text x="400" y="308" fill="#ffffff" font-family="system-ui, sans-serif" font-size="26" font-weight="900" text-anchor="middle">+</text>

  <!-- Right: Home Kit System -->
  <g transform="translate(420, 100)" filter="url(#bundleShadow)">
    <rect x="0" y="0" width="320" height="420" rx="14" fill="#ffffff" stroke="#0073D1" stroke-width="2"/>
    <rect x="16" y="16" width="150" height="26" rx="4" fill="#0073D1"/>
    <text x="91" y="34" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="800" text-anchor="middle">FOR YOUR HOME / OFFICE</text>

    <!-- Indoor Desktop Dock Graphic -->
    <rect x="40" y="70" width="240" height="150" rx="12" fill="#2d3748"/>
    <path d="M 70 120 L 110 180 L 210 180 L 250 120 Z" fill="#1a202c"/>
    <rect x="100" y="170" width="120" height="16" rx="3" fill="#000000"/>
    <text x="160" y="150" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Home Cradle SXDH4</text>

    <!-- Home Accessories Mini -->
    <g transform="translate(40, 240)">
      <circle cx="25" cy="25" r="18" fill="#f1f5f9"/>
      <rect x="15" y="15" width="20" height="20" rx="3" fill="#1e242c"/>
      <text x="55" y="30" fill="#334155" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Indoor/Outdoor Home Antenna</text>

      <circle cx="25" cy="70" r="18" fill="#f1f5f9"/>
      <rect x="16" y="62" width="18" height="16" rx="3" fill="#475569"/>
      <text x="55" y="75" fill="#334155" font-family="system-ui, sans-serif" font-size="12" font-weight="700">AC Home Power Supply</text>

      <circle cx="25" cy="115" r="18" fill="#f1f5f9"/>
      <path d="M 16 115 L 34 115" stroke="#ef4444" stroke-width="2"/>
      <text x="55" y="120" fill="#334155" font-family="system-ui, sans-serif" font-size="12" font-weight="700">RCA to 3.5mm Audio Cable</text>
    </g>
  </g>

  <!-- Bottom Save Tag -->
  <g transform="translate(250, 535)">
    <rect x="0" y="0" width="300" height="40" rx="8" fill="#16a34a"/>
    <text x="150" y="25" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="800" text-anchor="middle">BUNDLE & SAVE $20.00 INSTANTLY</text>
  </g>
</svg>

