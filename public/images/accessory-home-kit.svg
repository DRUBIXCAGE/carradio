<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <rect width="400" height="400" fill="#f8fafc" rx="12"/>
  <ellipse cx="200" cy="350" rx="140" ry="15" fill="#000000" opacity="0.1" filter="blur(6px)"/>
  
  <!-- Home Cradle SXDH4 -->
  <g transform="translate(100, 120)">
    <path d="M 30 80 L 70 170 L 130 170 L 170 80 Z" fill="#242b35" stroke="#374151" stroke-width="2"/>
    <rect x="60" y="160" width="80" height="15" rx="3" fill="#111827"/>
    <rect x="50" y="50" width="100" height="45" rx="6" fill="#1e242c" stroke="#334155" stroke-width="2"/>
    <text x="100" y="130" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">SXDH4 Dock</text>
  </g>

  <!-- Indoor/Outdoor Antenna with hinge -->
  <g transform="translate(240, 70)">
    <rect x="0" y="20" width="55" height="75" rx="6" fill="#1e242c" stroke="#334155" stroke-width="2"/>
    <circle cx="28" cy="100" r="8" fill="#475569"/>
    <rect x="18" y="105" width="20" height="25" fill="#334155"/>
    <path d="M 28 130 Q 10 180 30 200" fill="none" stroke="#64748b" stroke-width="3"/>
  </g>

  <!-- AC Power Supply & Cables -->
  <g transform="translate(60, 240)">
    <rect x="0" y="0" width="50" height="45" rx="6" fill="#1e242c" stroke="#334155" stroke-width="2"/>
    <rect x="10" y="45" width="8" height="15" fill="#94a3b8"/>
    <rect x="32" y="45" width="8" height="15" fill="#94a3b8"/>
    <path d="M 25 0 Q 60 -40 100 0" fill="none" stroke="#475569" stroke-width="2"/>
  </g>

  <!-- Audio Cable RCA -->
  <g transform="translate(230, 240)">
    <circle cx="20" cy="25" r="10" fill="#ef4444"/>
    <circle cx="45" cy="25" r="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
    <text x="70" y="30" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">RCA Audio</text>
  </g>
</svg>

