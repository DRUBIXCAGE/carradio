<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <filter id="partShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#001830" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="#f8fafc"/>

  <!-- Title Badge -->
  <rect x="50" y="30" width="700" height="44" rx="8" fill="#002b49"/>
  <text x="400" y="58" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="800" text-anchor="middle" letter-spacing="0.5">COMPLETE ONYX EZR VEHICLE KIT (SXEZR1V1) CONTENTS</text>

  <!-- Component 1: Onyx EZR Radio -->
  <g transform="translate(60, 100)" filter="url(#partShadow)">
    <rect x="0" y="0" width="320" height="210" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    <rect x="30" y="30" width="260" height="130" rx="10" fill="#1e2229"/>
    <rect x="45" y="45" width="160" height="75" rx="4" fill="#060c14"/>
    <text x="55" y="70" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="9" font-weight="700">CH 56 The Highway</text>
    <text x="55" y="90" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Luke Combs</text>
    <circle cx="240" cy="80" r="20" fill="#2d333d"/>
    <rect x="45" y="130" width="170" height="18" fill="#2a303c" rx="2"/>
    <text x="160" y="190" fill="#0f172a" font-family="system-ui, sans-serif" font-size="13" font-weight="800" text-anchor="middle">1. Onyx EZR Satellite Radio</text>
  </g>

  <!-- Component 2: PowerConnect Vehicle Dock -->
  <g transform="translate(420, 100)" filter="url(#partShadow)">
    <rect x="0" y="0" width="320" height="210" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    <path d="M 60 70 L 110 140 L 210 140 L 260 70 Z" fill="#23272e" stroke="#374151" stroke-width="2"/>
    <rect x="100" y="130" width="120" height="20" rx="4" fill="#111827"/>
    <text x="160" y="105" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">PowerConnect™</text>
    <text x="160" y="190" fill="#0f172a" font-family="system-ui, sans-serif" font-size="13" font-weight="800" text-anchor="middle">2. Vehicle PowerConnect Cradle</text>
  </g>

  <!-- Component 3: Magnetic Car Antenna -->
  <g transform="translate(60, 340)" filter="url(#partShadow)">
    <rect x="0" y="0" width="210" height="220" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    <!-- Antenna Puck -->
    <ellipse cx="105" cy="80" rx="42" ry="24" fill="#1b1e23" stroke="#374151" stroke-width="2"/>
    <ellipse cx="105" cy="74" rx="28" ry="14" fill="#29303a"/>
    <path d="M 105 100 Q 140 140 100 150 Q 60 160 110 170" fill="none" stroke="#475569" stroke-width="4"/>
    <text x="105" y="195" fill="#0f172a" font-family="system-ui, sans-serif" font-size="12" font-weight="800" text-anchor="middle">3. Magnetic Mount</text>
    <text x="105" y="210" fill="#64748b" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Roof Antenna</text>
  </g>

  <!-- Component 4: Vehicle 12V Power Adapter -->
  <g transform="translate(300, 340)" filter="url(#partShadow)">
    <rect x="0" y="0" width="210" height="220" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    <!-- Cigarette Lighter Plug -->
    <rect x="80" y="50" width="50" height="70" rx="6" fill="#1e242c"/>
    <rect x="92" y="120" width="26" height="25" fill="#475569"/>
    <circle cx="105" cy="148" r="4" fill="#94a3b8"/>
    <!-- LED indicator -->
    <circle cx="105" cy="75" r="4" fill="#008BE2"/>
    <path d="M 105 50 Q 80 30 110 25" fill="none" stroke="#475569" stroke-width="3"/>
    <text x="105" y="195" fill="#0f172a" font-family="system-ui, sans-serif" font-size="12" font-weight="800" text-anchor="middle">4. Power Adapter</text>
    <text x="105" y="210" fill="#64748b" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">12V Cigarette Lighter</text>
  </g>

  <!-- Component 5: Dash & Vent Mounts + Aux Cable -->
  <g transform="translate(540, 340)" filter="url(#partShadow)">
    <rect x="0" y="0" width="200" height="220" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    <!-- Swivel ball mount & vent clips -->
    <rect x="65" y="50" width="70" height="40" rx="6" fill="#2d333b"/>
    <circle cx="100" cy="70" r="16" fill="#475569"/>
    <!-- 3.5mm Aux audio cable -->
    <path d="M 60 120 C 80 100 120 150 140 120" fill="none" stroke="#00629B" stroke-width="3"/>
    <rect x="50" y="115" width="16" height="6" rx="2" fill="#94a3b8"/>
    <rect x="135" y="115" width="16" height="6" rx="2" fill="#94a3b8"/>
    <text x="100" y="185" fill="#0f172a" font-family="system-ui, sans-serif" font-size="12" font-weight="800" text-anchor="middle">5. Dash/Vent Mounts</text>
    <text x="100" y="202" fill="#64748b" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">+ 3.5mm AUX Cable</text>
  </g>
</svg>

