<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <rect width="400" height="400" fill="#f8fafc" rx="12"/>
  <ellipse cx="200" cy="340" rx="120" ry="14" fill="#000000" opacity="0.1" filter="blur(5px)"/>

  <!-- SXBTD1V1 Bluetooth Vehicle Cradle -->
  <g transform="translate(110, 100)">
    <path d="M 30 70 L 60 170 L 120 170 L 150 70 Z" fill="#242b35" stroke="#374151" stroke-width="2"/>
    <rect x="50" y="160" width="80" height="16" rx="3" fill="#111827"/>
    <rect x="40" y="50" width="100" height="45" rx="6" fill="#1e242c" stroke="#334155" stroke-width="2"/>

    <!-- Bluetooth Emblem on Cradle -->
    <circle cx="90" cy="115" r="22" fill="#00629B"/>
    <!-- Bluetooth icon path -->
    <path d="M 90 102 L 90 128 L 98 122 L 85 112 L 98 107 Z" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="90" y="150" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="9" font-weight="700" text-anchor="middle">BLUETOOTH</text>
  </g>

  <rect x="100" y="32" width="200" height="26" rx="13" fill="#00629B"/>
  <text x="200" y="49" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">WIRELESS AUDIO STREAMING</text>
</svg>

