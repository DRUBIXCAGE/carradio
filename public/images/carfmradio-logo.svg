<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 50" fill="none" width="100%" height="100%">
  <!-- Car & Radio Waves Icon -->
  <g transform="translate(6, 7)">
    <!-- Radio Signal Waves -->
    <path d="M 12 18 C 12 12.5 16.5 8 22 8 C 27.5 8 32 12.5 32 18" stroke="#008BE2" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 6 18 C 6 9.2 13.2 2 22 2 C 30.8 2 38 9.2 38 18" stroke="#00629B" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Car Body Silhouette -->
    <path d="M 2 28 L 7 20 L 14 16 L 30 16 L 37 20 L 42 28 L 43 32 L 1 32 Z" fill="#002B49"/>
    <!-- Car Wheels -->
    <circle cx="10" cy="32" r="4.5" fill="#181a1d" stroke="#008BE2" stroke-width="1.5"/>
    <circle cx="34" cy="32" r="4.5" fill="#181a1d" stroke="#008BE2" stroke-width="1.5"/>
    <!-- Headlight beam -->
    <polygon points="42,27 46,26 46,30 42,29" fill="#00A3FF"/>
  </g>

  <!-- Brand Typography -->
  <g transform="translate(58, 26)">
    <!-- Main Text: CAR FM RADIO -->
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="900" fill="#002B49" letter-spacing="-0.5">
      CAR<tspan fill="#00629B">FM</tspan><tspan fill="#008BE2">RADIO</tspan>
    </text>
    <text x="148" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#64748b">.com</text>

    <!-- Tagline underneath -->
    <text x="1" y="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8.5" font-weight="700" fill="#00629B" letter-spacing="1.2">
      SATELLITE &amp; VEHICLE AUDIO
    </text>
  </g>
</svg>

