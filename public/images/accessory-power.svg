<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <rect width="400" height="400" fill="#f8fafc" rx="12"/>
  <ellipse cx="200" cy="340" rx="110" ry="12" fill="#000000" opacity="0.1" filter="blur(5px)"/>

  <!-- 12V PowerConnect Cigarette Lighter Power Adapter -->
  <g transform="translate(130, 90)">
    <!-- Main Plug Housing -->
    <path d="M 40 40 L 100 40 L 90 140 L 50 140 Z" fill="#1b1f24" stroke="#2d3540" stroke-width="2"/>
    <rect x="52" y="140" width="36" height="35" rx="3" fill="#475569"/>
    <!-- Metal contact tip -->
    <circle cx="70" cy="180" r="6" fill="#cbd5e1"/>
    <!-- Side Ground Spring Clips -->
    <rect x="36" y="80" width="4" height="24" rx="2" fill="#94a3b8"/>
    <rect x="100" y="80" width="4" height="24" rx="2" fill="#94a3b8"/>
    
    <!-- LED indicator -->
    <circle cx="70" cy="65" r="4" fill="#008BE2"/>
    <circle cx="70" cy="65" r="8" fill="#008BE2" opacity="0.3"/>

    <!-- Red / Black Power Cable -->
    <path d="M 70 40 Q 110 0 130 50 Q 150 110 110 150 Q 80 200 130 240" fill="none" stroke="#27272a" stroke-width="5" stroke-linecap="round"/>
    <!-- Dock end connector -->
    <rect x="125" y="235" width="22" height="15" rx="3" fill="#00629B"/>
    <rect x="145" y="240" width="10" height="5" fill="#e2e8f0"/>
  </g>

  <rect x="110" y="32" width="180" height="26" rx="13" fill="#002b49"/>
  <text x="200" y="49" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">5V / 12V POWERCONNECT™</text>
</svg>

