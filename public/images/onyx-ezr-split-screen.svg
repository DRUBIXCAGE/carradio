<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="splitGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070c12"/>
      <stop offset="100%" stop-color="#020406"/>
    </linearGradient>
    <filter id="splitShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#001830" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="#f8fafc" rx="16"/>

  <g transform="translate(60, 50)" filter="url(#splitShadow)">
    <!-- Radio Frame Close Up -->
    <rect x="0" y="0" width="680" height="480" rx="24" fill="#1b1e23" stroke="#333a44" stroke-width="3"/>

    <!-- Display Screen -->
    <rect x="30" y="30" width="620" height="420" rx="12" fill="url(#splitGlass)" stroke="#222831" stroke-width="2"/>

    <!-- Split Screen Header -->
    <rect x="30" y="30" width="620" height="40" fill="#0f172a"/>
    <text x="50" y="56" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="14" font-weight="800">SPLIT-SCREEN VIEW MODE</text>
    <text x="580" y="56" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13" font-weight="700">12:45 PM</text>

    <!-- Left Pane: Currently Playing (50% width) -->
    <g transform="translate(50, 95)">
      <rect x="0" y="0" width="280" height="330" rx="8" fill="#131d2a" stroke="#1e293b" stroke-width="1.5"/>
      <rect x="16" y="16" width="90" height="24" rx="4" fill="#00629B"/>
      <text x="61" y="33" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="800" text-anchor="middle">CURRENT</text>

      <g transform="translate(16, 65)">
        <text x="0" y="0" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="700">CH 56</text>
        <text x="55" y="0" fill="#ffffff" font-family="system-ui, sans-serif" font-size="20" font-weight="900">The Highway</text>
        <text x="0" y="38" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="16" font-weight="700">Luke Combs</text>
        <text x="0" y="65" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14">Fast Car</text>
        <line x1="0" y1="95" x2="245" y2="95" stroke="#334155" stroke-width="1"/>
        <text x="0" y="125" fill="#64748b" font-family="system-ui, sans-serif" font-size="12">Category: Country</text>
        <text x="0" y="150" fill="#64748b" font-family="system-ui, sans-serif" font-size="12">Signal: Excellent [3/3]</text>

        <!-- Audio wave graphic -->
        <g transform="translate(0, 180)">
          <rect x="0" y="15" width="6" height="20" fill="#008BE2" rx="3"/>
          <rect x="10" y="5" width="6" height="30" fill="#008BE2" rx="3"/>
          <rect x="20" y="0" width="6" height="40" fill="#008BE2" rx="3"/>
          <rect x="30" y="10" width="6" height="25" fill="#008BE2" rx="3"/>
          <rect x="40" y="20" width="6" height="15" fill="#008BE2" rx="3"/>
          <text x="58" y="25" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="700">LIVE AUDIO</text>
        </g>
      </g>
    </g>

    <!-- Vertical Split Divider -->
    <line x1="365" y1="80" x2="365" y2="440" stroke="#334155" stroke-width="2" stroke-dasharray="4 4"/>

    <!-- Right Pane: What's Playing on Other Favorites -->
    <g transform="translate(385, 95)">
      <rect x="0" y="0" width="245" height="330" rx="8" fill="#0d141e" stroke="#1e293b" stroke-width="1.5"/>
      <rect x="16" y="16" width="130" height="24" rx="4" fill="#334155"/>
      <text x="81" y="33" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">FAVORITES FEED</text>

      <!-- Favorite Item 1 -->
      <g transform="translate(16, 60)">
        <rect x="0" y="0" width="30" height="20" rx="3" fill="#1e293b"/>
        <text x="15" y="15" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="800" text-anchor="middle">1</text>
        <text x="38" y="15" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="700">CH 2 • The Pulse</text>
        <text x="38" y="32" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Taylor Swift - Anti-Hero</text>
      </g>
      <line x1="16" y1="105" x2="230" y2="105" stroke="#1e293b" stroke-width="1"/>

      <!-- Favorite Item 2 -->
      <g transform="translate(16, 118)">
        <rect x="0" y="0" width="30" height="20" rx="3" fill="#1e293b"/>
        <text x="15" y="15" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="800" text-anchor="middle">2</text>
        <text x="38" y="15" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="700">CH 28 • The Spectrum</text>
        <text x="38" y="32" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">The Black Keys - Wild Child</text>
      </g>
      <line x1="16" y1="163" x2="230" y2="163" stroke="#1e293b" stroke-width="1"/>

      <!-- Favorite Item 3 -->
      <g transform="translate(16, 176)">
        <rect x="0" y="0" width="30" height="20" rx="3" fill="#1e293b"/>
        <text x="15" y="15" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="800" text-anchor="middle">3</text>
        <text x="38" y="15" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="700">CH 36 • Alt Nation</text>
        <text x="38" y="32" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Paramore - This Is Why</text>
      </g>
      <line x1="16" y1="221" x2="230" y2="221" stroke="#1e293b" stroke-width="1"/>

      <!-- Favorite Item 4 -->
      <g transform="translate(16, 234)">
        <rect x="0" y="0" width="30" height="20" rx="3" fill="#1e293b"/>
        <text x="15" y="15" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="800" text-anchor="middle">4</text>
        <text x="38" y="15" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="700">CH 84 • ESPNU Radio</text>
        <text x="38" y="32" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">College GameDay Live</text>
      </g>
    </g>
  </g>
</svg>

